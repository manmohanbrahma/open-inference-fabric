# Builds one Run:ai component with oif's patches (patches/runai/) into an image tarball in the oif state folder.
# The installer imports it into containerd and points Run:ai at it (stage runai-patches).
apiVersion: batch/v1
kind: Job
metadata:
  name: runai-patch-${COMPONENT}
  namespace: oif-build
  labels:
    app.kubernetes.io/managed-by: oif
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      # on the node that runs oif: the source, caches and the image tarball are host folders there (multi-node, T-123)
      nodeSelector: {kubernetes.io/hostname: "${BUILD_NODE}"}
      containers:
        - name: build
          image: ${BUILD_IMAGE}
          command: ["sh", "/build/${BUILD_SCRIPT}"]
          env:
            - {name: COMPONENT, value: "${COMPONENT}"}
            - {name: SRC_DIR, value: "${SRC_DIR}"}
            - {name: BINARY, value: "${BINARY}"}
            - {name: TEST_PKGS, value: "${TEST_PKGS}"}
            - {name: RUNAI_VERSION, value: "${RUNAI_VERSION}"}
            - {name: RUNAI_SOURCE_SHA256, value: "${RUNAI_SOURCE_SHA256}"}
            - {name: CRANE_VERSION, value: "${CRANE_VERSION}"}
            - {name: CRANE_SHA256, value: "${CRANE_SHA256}"}
            - {name: BASE_IMAGE, value: "${BASE_IMAGE}"}
            - {name: NEW_IMAGE, value: "${NEW_IMAGE}"}
            - {name: GOMODCACHE, value: /cache/go-mod}
            - {name: GOCACHE, value: /cache/go-build}
            - {name: GOFLAGS, value: -modcacherw}
            - {name: npm_config_cache, value: /cache/npm}
          resources:
            requests: {cpu: "4", memory: 6Gi}
          volumeMounts:
            - {name: scripts, mountPath: /build}
            - {name: patches, mountPath: /patches}
            - {name: out, mountPath: /out}
            - {name: src, mountPath: /src, readOnly: true}
            - {name: cache, mountPath: /cache}
      volumes:
        - {name: scripts, configMap: {name: runai-patch-build}}
        - {name: patches, configMap: {name: runai-patches}}
        - {name: out, hostPath: {path: "${RUNAI_PATCH_OUT}", type: DirectoryOrCreate}}
        # source and crane, downloaded and verified by the installer; Go module and npm caches kept between builds
        - {name: src, hostPath: {path: "${RUNAI_BUILD_SRC}", type: Directory}}
        - {name: cache, hostPath: {path: "${RUNAI_BUILD_CACHE}", type: DirectoryOrCreate}}
