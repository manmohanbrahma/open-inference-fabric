# kubeadm configuration for the first control-plane node; its control plane also runs workloads. On a single node
# API_ENDPOINT is the node's own address; with three control-plane nodes it is OIF_API_VIP, held by kube-vip.
# Rendered by oif (stage kubernetes); the placeholders come from versions.env and the saved settings.
apiVersion: kubeadm.k8s.io/v1beta4
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: ${HOST_IP}
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///run/containerd/containerd.sock
  kubeletExtraArgs:
    - name: node-ip
      value: ${HOST_IP}
  taints: []                    # no control-plane taint: GPU workloads run on this node
---
apiVersion: kubeadm.k8s.io/v1beta4
kind: ClusterConfiguration
kubernetesVersion: v${KUBERNETES_VERSION}
clusterName: oif
controlPlaneEndpoint: ${API_ENDPOINT}:6443
apiServer:
  certSANs: ["${API_ENDPOINT}", "${HOST_IP}"]
networking:
  podSubnet: ${POD_CIDR}
  serviceSubnet: ${SERVICE_CIDR}
---
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
maxPods: ${KUBELET_MAX_PODS}
