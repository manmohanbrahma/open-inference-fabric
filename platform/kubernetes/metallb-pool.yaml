# MetalLB hands out LoadBalancer addresses from the range chosen at install (layer 2 announcements).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: oif
  namespace: metallb-system
spec:
  addresses:
    - ${METALLB_RANGE}
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: oif
  namespace: metallb-system
spec:
  ipAddressPools:
    - oif
